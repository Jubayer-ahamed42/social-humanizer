[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "social-humanizer"
version = "0.2.0"
authors = [
  { name = "Social-Humanizer Contributors" },
]
description = "Universal AI Social Media Humanizer & Algorithmic Risk Auditor for Facebook, LinkedIn, Twitter/X, Threads, and Instagram."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "social-media",
    "anti-ai",
    "copywriting",
    "humanizer",
    "burstiness",
    "facebook",
    "linkedin",
    "twitter",
    "threads",
    "instagram",
    "algorithm-compliance",
    "reach-optimization",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "textstat>=0.7.3",
]
web = [
    "gradio>=4.0.0",
]

[project.scripts]
social-humanizer = "social_humanizer.cli:main"
humanizer = "social_humanizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["social_humanizer*"]
exclude = ["demo*", "tests*", "examples*"]
